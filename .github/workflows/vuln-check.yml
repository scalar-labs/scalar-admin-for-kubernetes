name: Vulnerability Check

on:
  workflow_call:
    inputs:
      target-ref:
        description: 'Target ref (branch, tag, release) to scan'
        required: true
        type: string
      find-latest-release:
        description: 'Flag to find the latest version for specified `target-ref`'
        required: false
        type: boolean
        default: false
      java-versions:
        description: 'Java version to use for building'
        required: false
        type: string
        default: '21'
    secrets:
      SLACK_SECURITY_WEBHOOK_URL:
        required: false

jobs:
  call-vuln-check:
    uses: scalar-labs/actions/.github/workflows/vuln-check-reusable.yaml@main
    with:
      target-ref: ${{ inputs.target-ref }}
      find-latest-release: ${{ inputs.find-latest-release }}
      images: '[["Scalar Admin for Kubernetes", "scalar-admin-for-kubernetes"]]'
      version-command: "./gradlew :lib:properties -q | grep version: | awk '{print $2}'"
      # This repository does not have the `docker` Gradle task, so build the image with the `docker build` command in the
      # same way as the release workflow. The image tag must be the same as the version printed by `version-command`.
      docker-build-command: |
        ./gradlew shadowJar
        docker build -t "ghcr.io/scalar-labs/scalar-admin-for-kubernetes:$(./gradlew :lib:properties -q | grep version: | awk '{print $2}')" ./cli
      java-versions: ${{ inputs.java-versions }}
    secrets:
      SLACK_SECURITY_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}
